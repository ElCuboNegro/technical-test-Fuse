# =============================================================================
# Redis Development Configuration
# =============================================================================
# This configuration is optimized for development with additional debugging
# and relaxed security settings for easier development workflow

# =============================================================================
# BASIC CONFIGURATION
# =============================================================================

# Network
bind 0.0.0.0
port 6379

# =============================================================================
# DEVELOPMENT SETTINGS
# =============================================================================

# More verbose logging for development
loglevel verbose

# Disable password requirement for development
# requirepass ""

# Development-friendly save parameters
save 1800 1
save 600 100
save 300 1000

# Smaller memory limits for development
maxmemory 128mb

# More aggressive eviction for development testing
maxmemory-policy volatile-lru

# Enable debug commands for development
# rename-command DEBUG DEBUG

# Reduce client timeout for faster development feedback
timeout 300

# Enable all keyspace notifications for development debugging
notify-keyspace-events "AKE"

# Reduce slow log threshold for development debugging
slowlog-log-slower-than 1000

# Increase slow log size for development analysis
slowlog-max-len 256

# =============================================================================
# DEVELOPMENT SPECIFIC SETTINGS
# =============================================================================

# Disable some persistence features for faster development
# (data loss is acceptable in development)
appendonly no

# Reduce background save frequency
# save ""

# Enable more detailed statistics
# info-refresh-interval 1