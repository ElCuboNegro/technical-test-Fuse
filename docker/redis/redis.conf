# =============================================================================
# Redis Configuration for Multi-Agent AI Application
# =============================================================================
# This configuration is optimized for both development and production use
# Environment-specific settings are controlled via Docker environment variables

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================

# Bind to all interfaces (Docker networking)
bind 0.0.0.0

# Default port
port 6379

# Disable protected mode for Docker networking
protected-mode no

# TCP listen backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# =============================================================================
# GENERAL CONFIGURATION
# =============================================================================

# Run as daemon (handled by Docker)
daemonize no

# Process ID file (not needed in Docker)
# pidfile /var/run/redis_6379.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log to stdout (Docker will capture)
logfile ""

# Number of databases
databases 16

# =============================================================================
# PERSISTENCE CONFIGURATION
# =============================================================================

# RDB Snapshots
# Save the DB on disk if both conditions are met:
# - At least N seconds elapsed since last save
# - At least M changes occurred
save 900 1      # Save if at least 1 key changed in 900 seconds (15 minutes)
save 300 10     # Save if at least 10 keys changed in 300 seconds (5 minutes)
save 60 10000   # Save if at least 10000 keys changed in 60 seconds

# Compress RDB files
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory
dir /data

# AOF (Append Only File) persistence
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy: always, everysec, no
appendfsync everysec

# Rewrite AOF when it grows by this percentage
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================

# Maximum memory usage (will be set via environment variable in production)
# maxmemory 256mb

# Memory eviction policy when max memory is reached
maxmemory-policy allkeys-lru

# Memory sampling for LRU eviction
maxmemory-samples 5

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# Require password (set via environment variable)
# requirepass your_redis_password_here

# Rename dangerous commands (optional security measure)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# =============================================================================
# CLIENT CONFIGURATION
# =============================================================================

# Maximum number of connected clients
maxclients 10000

# Client timeout (0 = disabled)
timeout 0

# =============================================================================
# SLOW LOG CONFIGURATION
# =============================================================================

# Log queries slower than this many microseconds
slowlog-log-slower-than 10000

# Maximum length of slow log
slowlog-max-len 128

# =============================================================================
# ADVANCED CONFIGURATION
# =============================================================================

# Hash table rehashing
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression
list-max-ziplist-size -2
list-compress-depth 0

# Set hash table
set-max-intset-entries 512

# Sorted set ziplist
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Streams configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol buffer limit
proto-max-bulk-len 512mb

# =============================================================================
# LATENCY MONITORING
# =============================================================================

# Latency monitoring threshold in milliseconds
latency-monitor-threshold 100

# =============================================================================
# EVENT NOTIFICATION
# =============================================================================

# Keyspace notifications (useful for agent session management)
# K = keyspace events
# E = keyevent events
# g = generic commands (DEL, EXPIRE, RENAME, etc.)
# $ = string commands
# x = expired events
notify-keyspace-events "Egx"

# =============================================================================
# DEVELOPMENT/DEBUGGING
# =============================================================================

# Enable debug mode for development (will be overridden in production)
# debug-mode yes

# =============================================================================
# MODULES AND EXTENSIONS
# =============================================================================

# Load Redis modules (if needed)
# loadmodule /path/to/module.so

# =============================================================================
# CLUSTER CONFIGURATION (for future scaling)
# =============================================================================

# Cluster mode disabled for single-instance setup
# cluster-enabled no