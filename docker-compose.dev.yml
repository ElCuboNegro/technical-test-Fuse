services:
  # PostgreSQL Database Service
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ${COMPOSE_PROJECT_NAME:-multi-agent-ai-dev}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agents_app_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-agents_app_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # Web Application Service
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-multi-agent-ai-dev}-web
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WEB_PORT=${WEB_PORT:-3000}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-agents_app_dev}
      - POSTGRES_USER=${POSTGRES_USER:-dev_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dev_user}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-agents_app_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev_redis_secure_password_2024}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_secure_password_2024}@redis:6379
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./turbo.json:/app/turbo.json
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-multi-agent-ai-dev}-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis-dev.conf --requirepass ${REDIS_PASSWORD:-dev_redis_secure_password_2024}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev_redis_secure_password_2024}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./docker/redis/redis-dev.conf:/usr/local/etc/redis/redis-dev.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_secure_password_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # Agents Application Service
  agents:
    build:
      context: .
      dockerfile: docker/agents/Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-multi-agent-ai-dev}-agents
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - AGENTS_PORT=${AGENTS_PORT:-2024}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-agents_app_dev}
      - POSTGRES_USER=${POSTGRES_USER:-dev_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dev_user}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-agents_app_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev_redis_secure_password_2024}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_secure_password_2024}@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Vector database: Using pgvector (PostgreSQL extension) for all vector operations
    ports:
      - "${AGENTS_PORT:-2024}:2024"
    volumes:
      - ./apps/agents:/app/apps/agents
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./turbo.json:/app/turbo.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./langgraph.json:/app/langgraph.json
      - /app/node_modules
      - /app/apps/agents/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  app-network:
    driver: bridge
